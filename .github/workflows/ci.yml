name: Product foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown --no-self-update
      - run: make store-prepare
      - run: cargo fetch --locked
      - run: make store-engine
      - run: make build
      - run: make check
      - run: make store-idempotency store-migrations store-maintenance store-recovery
      - run: make sdk-outbox-check
      - name: Prepare immutable PostgreSQL image
        timeout-minutes: 5
        run: timeout 15s docker info >/dev/null && make db-prepare
      - name: Exercise real PostgreSQL storage and recovery
        timeout-minutes: 8
        run: make db-schema db-migrations db-sequence db-repair
      - name: Exercise durable conversation sync projection
        timeout-minutes: 12
        run: make sync-check
      - name: Exercise bounded message delta reads
        timeout-minutes: 15
        run: make message-delta-check
      - name: Exercise auth token storage and identity
        timeout-minutes: 10
        run: make auth-check
      - name: Exercise auth recovery and revocation durability
        timeout-minutes: 12
        run: make auth-recovery
      - name: Exercise auth policy boundary
        timeout-minutes: 10
        run: make auth-policy
      - name: Exercise bearer session HTTP boundary
        timeout-minutes: 10
        run: make auth-http-check
      - name: Exercise bearer session HTTP security boundaries
        timeout-minutes: 10
        run: make auth-http-security
      - name: Exercise loopback bearer session route mounting
        timeout-minutes: 12
        run: make auth-route-check
      - name: Exercise trusted application token issuance
        timeout-minutes: 12
        run: make auth-issuer-check
      - name: Exercise durable device admission and session revocation
        timeout-minutes: 12
        run: make auth-admission-check
      - name: Exercise trusted account-wide session revocation
        timeout-minutes: 12
        run: make auth-account-revoke-check auth-account-revoke-security auth-account-revoke-recovery
      - name: Exercise authenticated realtime gateway and durable resume
        timeout-minutes: 12
        run: make gateway-check gateway-security gateway-recovery
      - name: Exercise trusted provisioning and authenticated profiles
        timeout-minutes: 12
        run: make user-check user-security
      - name: Exercise authenticated friend operations and durable changes
        timeout-minutes: 12
        run: make friend-check friend-security friend-recovery
      - name: Exercise client TLS message send, WSS delivery and recovery
        timeout-minutes: 12
        run: make tls-message-check tls-message-security tls-message-recovery
      - name: Exercise private first-message policy and device quotas
        timeout-minutes: 12
        run: make stranger-send-check stranger-send-security stranger-send-recovery
      - name: Exercise small-group membership, history and recovery
        timeout-minutes: 12
        run: make group-check group-security group-recovery
      - name: Exercise conversation source writes and online backfill
        timeout-minutes: 12
        run: make sync-source-check sync-source-security sync-source-recovery
      - name: Exercise authenticated TLS conversation sync and cursor recovery
        timeout-minutes: 12
        run: make sync-http-check sync-http-security sync-http-recovery
      - name: Exercise authenticated message sequence recovery over TLS
        timeout-minutes: 12
        run: make message-delta-http-check message-delta-http-security message-delta-http-recovery
      - name: Exercise cross-device conversation read watermarks
        timeout-minutes: 12
        run: make read-watermark-check read-watermark-security read-watermark-recovery
      - name: Exercise direct message read receipts
        timeout-minutes: 12
        run: make read-receipt-check read-receipt-security read-receipt-recovery
      - name: Exercise read state in conversation sync
        timeout-minutes: 12
        run: make read-sync-check read-sync-security read-sync-recovery read-sync-query-plan
      - name: Exercise account conversation settings and history
        timeout-minutes: 12
        run: make conversation-account-sync-check conversation-account-sync-security conversation-account-sync-recovery conversation-account-sync-query-plan
      - name: Exercise native SDK conversation sync through TLS
        timeout-minutes: 12
        run: make conversation-account-sdk-check
      - name: Exercise SDK message convergence and gap recovery
        timeout-minutes: 15
        run: make message-sdk-sync-check message-sdk-sync-convergence message-sdk-sync-retries message-sdk-sync-recovery
      - name: Exercise idempotent current-token revocation
        timeout-minutes: 12
        run: make auth-logout-check
      - name: Exercise current-token revocation security gates
        timeout-minutes: 10
        run: make auth-logout-security
      - name: Exercise media protocol, grants, storage and authorization
        timeout-minutes: 20
        run: make media-check
      - name: Exercise authenticated TLS media transfer and recovery
        timeout-minutes: 15
        run: make media-http-check media-http-security media-http-recovery
      - name: Exercise private S3 media transfer and recovery
        timeout-minutes: 15
        run: make media-s3-check media-s3-security media-s3-recovery
      - name: Exercise durable message send transaction
        timeout-minutes: 10
        run: make message-check
      - name: Exercise message recovery and ambiguous commit convergence
        timeout-minutes: 12
        run: make message-recovery
      - name: Exercise message permanent and retryable errors
        timeout-minutes: 10
        run: make message-errors
      - name: Exercise loopback bearer text message send
        timeout-minutes: 20
        run: make message-http-check
      - name: Exercise message HTTP security gates
        timeout-minutes: 20
        run: make message-http-security
      - name: Exercise private conversation and block policy
        timeout-minutes: 12
        run: make private-message-policy-check
      - name: Exercise server observability contracts
        timeout-minutes: 15
        run: make message-observability-check message-observability-metrics message-observability-security
      - name: Exercise server observability recovery gauges
        timeout-minutes: 15
        run: make message-observability-recovery
      - name: Verify message HTTP negative gate self-tests
        timeout-minutes: 5
        run: make message-http-gate-self-test
      - name: Exercise durable webhook fan-out, signing, security and redaction
        timeout-minutes: 20
        run: make webhook-protocol webhook-recovery webhook-security webhook-redaction
      - name: Exercise webhook endpoint management and delivery replay
        timeout-minutes: 15
        run: make webhook-api webhook-api-security
