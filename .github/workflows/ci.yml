name: Product foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown --no-self-update
      - run: make build
      - run: make check
      - name: Prepare immutable PostgreSQL image
        timeout-minutes: 5
        run: timeout 15s docker info >/dev/null && make db-prepare
      - name: Exercise real PostgreSQL storage and recovery
        timeout-minutes: 8
        run: make db-schema db-migrations db-sequence db-repair
