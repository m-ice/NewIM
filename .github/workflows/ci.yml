name: Product foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown --no-self-update
      - run: make store-prepare
      - run: cargo fetch --locked
      - run: make store-engine
      - run: make build
      - run: make check
      - run: make store-idempotency store-migrations store-maintenance store-recovery
      - run: make sdk-outbox-check
      - name: Prepare immutable PostgreSQL image
        timeout-minutes: 5
        run: timeout 15s docker info >/dev/null && make db-prepare
      - name: Exercise real PostgreSQL storage and recovery
        timeout-minutes: 8
        run: make db-schema db-migrations db-sequence db-repair
      - name: Exercise durable conversation sync projection
        timeout-minutes: 12
        run: make sync-check
      - name: Exercise bounded message delta reads
        timeout-minutes: 15
        run: make message-delta-check
      - name: Exercise auth token storage and identity
        timeout-minutes: 10
        run: make auth-check
      - name: Exercise auth recovery and revocation durability
        timeout-minutes: 12
        run: make auth-recovery
      - name: Exercise auth policy boundary
        timeout-minutes: 10
        run: make auth-policy
      - name: Exercise media protocol, grants, storage and authorization
        timeout-minutes: 20
        run: make media-check
      - name: Exercise durable message send transaction
        timeout-minutes: 10
        run: make message-check
      - name: Exercise message recovery and ambiguous commit convergence
        timeout-minutes: 12
        run: make message-recovery
      - name: Exercise message permanent and retryable errors
        timeout-minutes: 10
        run: make message-errors
